<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inicio | El Negocio del Año</title>

<style>

@font-face {
    font-family: "Sorren";
    src: url("Sorren-Bold 400.otf") format("opentype");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background-image: url("fondo2.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* ===== MENÚ ===== */

.menu-lateral {
    position: fixed;
    top: 0;
    left: 0;
    width: 65px;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.88);
    border-right: 2px solid #ffba00;
    z-index: 100;
    overflow: hidden;
    transition: width 0.35s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.menu-lateral:hover {
    width: 280px;
}

.indicador-menu {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 23px;
    height: 2px;
    background-color: #ffba00;
}

.indicador-menu::before,
.indicador-menu::after {
    content: "";
    position: absolute;
    width: 23px;
    height: 2px;
    background-color: #ffba00;
    left: 0;
}

.indicador-menu::before { top: -7px; }
.indicador-menu::after { top: 7px; }

.menu-lateral:hover .indicador-menu {
    opacity: 0;
}

/* OPCIONES */

.menu-opciones {
    width: 280px;
    opacity: 0;
    transform: translateX(-30px);
    transition: 0.3s;
}

.menu-lateral:hover .menu-opciones {
    opacity: 1;
    transform: translateX(0);
}

.menu-opciones a {
    display: block;
    padding: 18px 35px;
    text-decoration: none;
    color: white;
    font-family: "Sorren", Arial, sans-serif;
    font-size: 22px;
}

.menu-opciones a:hover {
    color: black;
    background-color: #ffba00;
}

/* CONTENIDO */

.contenido {
    width: 100%;
    height: 100vh;
}

/* BOTÓN MÓVIL */

.menu-btn {
    display: none;
    font-size: 28px;
    color: #ffba00;
    padding: 15px;
    cursor: pointer;
    z-index: 1000;
}

/* ===== MÓVIL ===== */

@media (max-width: 768px) {

    .menu-lateral {
        width: 100%;
        height: 60px;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        overflow: visible;
    }

    .menu-btn {
        display: block;
    }

    .indicador-menu {
        display: none;
    }

    .menu-opciones {
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: rgba(0,0,0,0.95);

        transform: translateY(-120%);
        transition: transform 0.3s ease;

        opacity: 1;
        z-index: 999;
    }

    .menu-opciones.activo {
        transform: translateY(0);
    }

    .menu-opciones a {
        padding: 15px;
        font-size: 18px;
    }

    .contenido {
        padding-top: 60px;
    }
}

</style>
</head>

<body>

<nav class="menu-lateral">

    <!-- BOTÓN ☰ -->
    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="indicador-menu"></div>

    <div class="menu-opciones">
        <a href="inicio.html">INICIO</a>
        <a href="pre-registro.html">PRE-REGISTRO</a>
        <a href="#">PATROCINADORES</a>
        <a href="#">PELEADORES</a>
        <a href="#">CONTÁCTANOS</a>

        <a href="https://www.twitch.tv/chef_urbano_ens" target="_blank">TWITCH</a>
        <a href="https://www.facebook.com/ChefUrbanoEns" target="_blank">FACEBOOK</a>
    </div>

</nav>

<main class="contenido">
</main>

<script>
function toggleMenu() {
    document.querySelector(".menu-opciones").classList.toggle("activo");
}
</script>

</body>
</html>
