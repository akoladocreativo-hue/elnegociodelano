<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inicio | El Negocio del Año</title>


    <style>

        /* =========================================
           FUENTE
        ========================================= */

        @font-face {
            font-family: "Sorren";
            src: url("Sorren-Bold 400.otf") format("opentype");
        }


        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;


            /* ===============================
               NUEVO FONDO

               CAMBIA "fondo2.png"
               SI TU ARCHIVO TIENE OTRO NOMBRE
            =============================== */

            background-image: url("fondo2.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;
        }



        /* =========================================
           ZONA DEL MENÚ
        ========================================= */

        .menu-lateral {

            position: fixed;

            top: 0;
            left: 0;

            width: 65px;
            height: 100vh;

            background-color: rgba(0, 0, 0, 0.88);

            border-right: 2px solid #ffba00;

            z-index: 100;

            overflow: hidden;

            transition: width 0.35s ease;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }



        /* =========================================
           CUANDO PASAMOS EL MOUSE
        ========================================= */

        .menu-lateral:hover {

            width: 280px;

        }



        /* =========================================
           LÍNEA / INDICADOR DEL MENÚ
        ========================================= */

        .indicador-menu {

            position: absolute;

            right: 20px;
            top: 50%;

            transform: translateY(-50%);

            width: 23px;
            height: 2px;

            background-color: #ffba00;

            transition: opacity 0.2s ease;
        }


        .indicador-menu::before,
        .indicador-menu::after {

            content: "";

            position: absolute;

            width: 23px;
            height: 2px;

            background-color: #ffba00;

            left: 0;
        }


        .indicador-menu::before {

            top: -7px;

        }


        .indicador-menu::after {

            top: 7px;

        }



        /* Ocultamos el símbolo cuando se abre */

        .menu-lateral:hover .indicador-menu {

            opacity: 0;

        }



        /* =========================================
           CONTENEDOR DE OPCIONES
        ========================================= */

        .menu-opciones {

            width: 280px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            opacity: 0;

            transform: translateX(-30px);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;

            transition-delay: 0.05s;
        }



        /* Mostrar opciones al pasar el mouse */

        .menu-lateral:hover .menu-opciones {

            opacity: 1;

            transform: translateX(0);

        }



        /* =========================================
           BOTONES DEL MENÚ
        ========================================= */

        .menu-opciones a {

            position: relative;

            display: block;

            width: 100%;

            padding: 18px 35px;

            text-decoration: none;

            color: white;

            font-family: "Sorren", Arial, sans-serif;

            font-size: 22px;

            letter-spacing: 1px;

            transition:
                color 0.25s ease,
                background-color 0.25s ease,
                padding-left 0.25s ease;
        }



        /* =========================================
           EFECTO HOVER DE CADA OPCIÓN
        ========================================= */

        .menu-opciones a:hover {

            color: #000000;

            background-color: #ffba00;

            padding-left: 45px;

        }



        /* =========================================
           PEQUEÑA LÍNEA AMARILLA
        ========================================= */

        .menu-opciones a::before {

            content: "";

            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            width: 6px;
            height: 6px;

            background-color: #ffba00;

            border-radius: 50%;

            transition: background-color 0.25s ease;
        }


        .menu-opciones a:hover::before {

            background-color: #000000;

        }



        /* =========================================
           CONTENIDO PRINCIPAL
        ========================================= */

        .contenido {

            width: 100%;
            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;
        }


    </style>

</head>



<body>


    <!-- =========================================
         MENÚ LATERAL
    ========================================== -->

    <nav class="menu-lateral">


        <!-- Indicador cuando está cerrado -->

        <div class="indicador-menu"></div>



        <!-- Opciones -->

        <div class="menu-opciones">

            </a>

            <a href="transmisión.html">

            </a>

        </div>


    </nav>



    <!-- =========================================

         TODAVÍA LO DEJAMOS VACÍO
    ========================================== -->

    <main class="contenido">

    </main>


</body>

</html>
